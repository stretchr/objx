name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.27', '1.26', '1.25' ]
    steps:
    - uses: actions/checkout@v7

    - name: Install Task
      uses: go-task/setup-task@v2

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Lint
      run: diff -u <(echo -n) <(task lint)

    - name: Test
      run: task test
