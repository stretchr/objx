name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27'

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: [ '1.27', '1.26', '1.25' ]
    steps:
    - uses: actions/checkout@v7

    - name: Install Task
      uses: go-task/setup-task@v2

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go }}

    - name: Test
      run: task test
